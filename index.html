<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17130f">
<title>TOP TRIP|روابطنا</title>
<meta name="description" content="TOP TRIP – رحلات باجي في الصحراء وتجارب مغامرة في قلب العلا">
<meta property="og:title" content="TOP TRIP AlUla">
<meta property="og:description" content="اكتشف العلا بطريقة مختلفة">
<meta property="og:image" content="https://top-trip.pages.dev/images/logo.png?v=3">
<link rel="icon" href="https://top-trip.pages.dev/images/logo.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#17130f;
    --card:rgba(23,19,15,.55);
    --card-hover:rgba(40,31,22,.72);
    --line:rgba(217,163,91,.35);
    --gold:#d9a35b;
    --gold-2:#f0c987;
    --text:#f5ece0;
    --muted:#c9b9a4;
    --ok:#4ade80;
    --bad:#f87171;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--text);
    background:var(--bg);
    display:flex;justify-content:center;
    padding:28px 18px 26px;
  }
  /* الخلفية: صورة + تعتيم */
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(800px 420px at 50% -5%, rgba(217,163,91,.20), transparent 60%),
      linear-gradient(180deg,rgba(23,19,15,.55),rgba(23,19,15,.88)),
      url("bg.jpg") center/cover no-repeat;
  }
  .wrap{position:relative;width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center}

  /* زر الترجمة */
  .lang{
    position:absolute;top:0;left:0;
    display:inline-flex;align-items:center;gap:7px;
    padding:8px 14px;border-radius:999px;cursor:pointer;
    font:inherit;font-weight:700;font-size:.88rem;color:var(--text);
    background:var(--card);border:1px solid var(--line);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:all .2s ease;
  }
  .lang svg{width:18px;height:18px;color:var(--gold-2)}
  .lang:hover,.lang:focus-visible{background:var(--gold);color:#17130f;border-color:var(--gold);outline:none}
  .lang:hover svg,.lang:focus-visible svg{color:#17130f}

  .logo{
    margin-top:44px;
    width:150px;height:150px;border-radius:50%;
    padding:5px;background:linear-gradient(135deg,var(--gold-2),#9a5f2c);
    box-shadow:0 12px 40px rgba(0,0,0,.55);
    animation:rise .7s ease both;
  }
  .logo img{width:100%;height:100%;border-radius:50%;object-fit:contain;padding:14px;background:#f5ece0;display:block}
  h1{margin-top:16px;font-size:1.7rem;font-weight:800;letter-spacing:.5px;text-shadow:0 2px 12px rgba(0,0,0,.5);animation:rise .7s .08s ease both}
  .tag{margin-top:6px;color:var(--gold-2);font-weight:500;font-size:1.02rem;text-shadow:0 2px 10px rgba(0,0,0,.5);animation:rise .7s .14s ease both}
  .sub{margin-top:4px;color:var(--muted);font-size:.8rem;letter-spacing:2px;direction:ltr;animation:rise .7s .18s ease both}

  /* ساعات العمل */
  .hours{
    margin-top:18px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 10px;
    animation:rise .7s .2s ease both;
  }
  .pill{
    display:inline-flex;align-items:center;gap:8px;
    padding:8px 14px;border-radius:999px;font-size:.88rem;font-weight:500;
    background:var(--card);border:1px solid var(--line);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  .pill svg{width:17px;height:17px;color:var(--gold-2);flex:none}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
  .is-open .dot{background:var(--ok);box-shadow:0 0 0 0 rgba(74,222,128,.6);animation:pulse 1.8s infinite}
  .is-closed .dot{background:var(--bad)}
  .is-open #hstate{color:var(--ok);font-weight:700}
  .is-closed #hstate{color:var(--bad);font-weight:700}

  .notice{
    display:none;margin-top:12px;max-width:100%;align-items:flex-start;gap:10px;
    padding:12px 16px;border-radius:16px;font-size:.92rem;line-height:1.7;font-weight:500;
    background:rgba(248,113,113,.14);border:1px solid rgba(248,113,113,.5);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  .notice.show{display:flex}
  .notice svg{width:20px;height:20px;color:var(--bad);flex:none;margin-top:3px}

  .links{width:100%;margin-top:24px;display:flex;flex-direction:column;gap:14px}
  .link{
    display:flex;align-items:center;gap:14px;
    padding:14px 16px;border-radius:18px;
    background:var(--card);border:1px solid var(--line);
    color:var(--text);text-decoration:none;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:transform .2s ease,background .2s ease,border-color .2s ease;
    animation:rise .6s ease both;
  }
  .link:nth-child(1){animation-delay:.24s}.link:nth-child(2){animation-delay:.30s}.link:nth-child(3){animation-delay:.36s}
  .link:hover,.link:focus-visible{transform:translateY(-3px);background:var(--card-hover);border-color:var(--gold);outline:none}
  .link .ico{
    flex:none;width:46px;height:46px;border-radius:14px;
    display:grid;place-items:center;
    background:linear-gradient(135deg,var(--gold-2),#b36f33);color:#17130f;
  }
  .link .ico svg{width:24px;height:24px}
  .link .t{flex:1;text-align:center;font-weight:700;font-size:1.05rem}
  .link .t small{display:block;font-weight:400;color:var(--muted);font-size:.8rem;margin-top:2px}
  .link .arrow{flex:none;width:20px;height:20px;color:var(--gold);opacity:.85}
  .primary{background:linear-gradient(135deg,var(--gold-2),#c27f3a);color:#17130f;border-color:transparent}
  .primary:hover{background:linear-gradient(135deg,#ffd9a0,#d18b44)}
  .primary .ico{background:#17130f;color:var(--gold-2)}
  .primary .t small,.primary .arrow{color:#3b2a18}

  .social{margin-top:28px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px;animation:rise .7s .44s ease both}
  .social a{
    width:48px;height:48px;border-radius:50%;
    display:grid;place-items:center;color:var(--text);
    border:1px solid var(--line);background:var(--card);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:all .2s ease;
  }
  .social a:hover,.social a:focus-visible{background:var(--gold);color:#17130f;transform:translateY(-3px);outline:none}
  .social svg{width:22px;height:22px}

  footer{margin-top:34px;color:var(--muted);font-size:.78rem;text-align:center;line-height:1.9;display:flex;flex-direction:column;align-items:center;gap:6px}
  footer .brand{letter-spacing:2px;direction:ltr}
  .visits{
    display:inline-flex;align-items:center;gap:7px;direction:ltr;
    padding:6px 14px;border-radius:999px;font-weight:700;font-size:.9rem;color:var(--text);
    background:var(--card);border:1px solid var(--line);
  }
  .visits svg{width:18px;height:18px;color:var(--gold-2)}

  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes pulse{70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">

  <button class="lang" id="lang" type="button" aria-label="Change language">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6"/></svg>
    <span id="langtxt">English</span>
  </button>

  <div class="logo"><img src="https://top-trip.pages.dev/images/logo.png?v=3" alt="TOP TRIP" onerror="this.style.visibility='hidden'"></div>
  <h1>TOP TRIP</h1>
  <p class="tag" data-i="tag"></p>
  <p class="sub">EXPERIENCE OFFROAD ADVENTURE</p>

  <!-- ساعات العمل -->
  <div class="hours" id="hours">
    <span class="pill" id="state">
      <span class="dot"></span>
      <span id="hstate"></span>
    </span>
    <span class="pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span id="htime"></span>
    </span>
  </div>

  <div class="notice" id="notice" role="status">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.700 3.900a2 2 0 0 0-3.400 0Z"/><path d="M12 9v4M12 17h.01"/></svg>
    <span id="reason"></span>
  </div>

  <!-- الأزرار الرئيسية -->
  <nav class="links" id="links"></nav>

  <!-- السوشال ميديا -->
  <div class="social" id="social"></div>

  <footer>
    <!-- عدّاد الزيارات: رقم + أيقونة عين على يساره -->
    <div class="visits" id="visits" title="Visitors">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
      <span id="vc">—</span>
    </div>
    <div data-i="addr"></div>
    <div class="brand">© <span id="y"></span> TOP TRIP</div>
  </footer>
</main>

<script>
/* ============ الإعدادات: عدّل هنا فقط ============ */
const WHATSAPP = "966593304444";           // رقم الواتساب بدون +
const EMAIL    = "Toptrip50@gmail.com";
const OPEN_H = 8, CLOSE_H = 18;            // ساعات العمل بتوقيت السعودية (24 ساعة)
const TZ = "Asia/Riyadh";
const COUNTER = "https://abacus.jasoncameron.dev"; // عدّاد الزيارات (مجاني)
const COUNTER_KEY = "toptrip-linkpage/visits";

const LINKS = [
  { ar:"احجز الآن",     en:"Book Now",         href:"https://top-trip.pages.dev/", icon:"globe", primary:true },
  { ar:"موقع الانطلاق", en:"Location",         href:"https://www.google.com/maps/search/?api=1&query=Top+Trip+AlUla", icon:"pin" },
  { ar:"أعمالنا",       en:"Our works",        href:"https://drive.google.com/drive/folders/1SYB7x4udSeZMvfAkLYB-11Xo_OBm95ph", icon:"image" },
];

const SOCIAL = [
  { name:"Instagram", href:"https://www.instagram.com/toptrip.50/", icon:"ig" },
  { name:"WhatsApp",  href:`https://wa.me/${WHATSAPP}`,              icon:"wa" },
  { name:"Email",     href:`mailto:${EMAIL}`,                        icon:"mail" },
  // { name:"TikTok",  href:"https://www.tiktok.com/@YOUR_HANDLE", icon:"tt" },
  // { name:"X",       href:"https://x.com/YOUR_HANDLE",           icon:"x" },
  // { name:"Snapchat",href:"https://www.snapchat.com/add/YOUR_HANDLE", icon:"sc" },
];

const TEXT = {
  ar:{ tag:"اكتشف العلا بطريقة مختلفة", addr:"المنقى، العلا · 43543 · المملكة العربية السعودية",
       open:"مفتوح الآن", closed:"مغلق الآن · نفتح 8:00 ص", tempClosed:"مغلق مؤقتًا", time:"8:00 ص – 6:00 م", btn:"English", title:"TOP TRIP AlUla | روابطنا" },
  en:{ tag:"Discover AlUla differently", addr:"AlManqa, AlUla · 43543 · Saudi Arabia",
       open:"Open now", closed:"Closed now · Opens 8:00 AM", tempClosed:"Temporarily closed", time:"8:00 AM – 6:00 PM", btn:"العربية", title:"TOP TRIP AlUla | Links" }
};
/* ================================================= */

const I = {
  wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.8 14.1c-.2.7-1.4 1.3-1.9 1.3-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5-4.5-.1-.2-1.2-1.6-1.2-3s.8-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.2-.3.3-.1.6.2.3.7 1.2 1.5 1.9 1 .9 1.9 1.2 2.2 1.3.3.1.4.1.6-.1l.8-1c.2-.2.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.1.1.6-.1 1.2Z"/></svg>',
  globe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4M8 14h3"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg>',
  ig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18a1 1 0 0 1 1 1v.4l-10 6.3L2 6.4V6a1 1 0 0 1 1-1Zm-1 3.7 10 6.2 10-6.2V18a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V8.7Z"/></svg>',
  tt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 3c.3 2.3 1.7 3.8 4 4v3.2c-1.4 0-2.8-.4-4-1.2V15a6 6 0 1 1-6-6c.3 0 .6 0 .9.1v3.3a2.7 2.7 0 1 0 1.8 2.6V3h3.300Z"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.8 3h3.1l-6.8 7.7L22 21h-6.200l-4.800-6.300L5.400 21H2.300l7.300-8.300L2 3h6.400l4.400 5.800L17.800 3Zm-1.100 16.200h1.700L7.400 4.700H5.600l11.100 14.500Z"/></svg>',
  sc:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c3 0 5 2.100 5 5v2.400c.4.100.9.200 1.300.3.600.1.700.8.100 1-.6.3-1.100.4-1.300.7-.1.200 0 .5.200.8.800 1.300 1.800 2 3 2.300.4.100.5.600.1.800-.7.400-1.500.5-2 .7-.2.600-.5 1.100-.9 1-.5-.1-1-.3-1.700-.1-1 .3-1.600 1.700-3.800 1.700s-2.800-1.400-3.800-1.700c-.7-.2-1.200 0-1.700.1-.4.100-.7-.4-.9-1-.5-.2-1.300-.3-2-.7-.4-.2-.3-.7.100-.8 1.200-.3 2.200-1 3-2.300.2-.3.300-.6.200-.8-.2-.3-.7-.4-1.300-.7-.6-.2-.5-.9.100-1 .4-.1.900-.2 1.300-.3V7c0-2.900 2-5 5-5Z"/></svg>'
};
const arrow = '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';

let lang = "ar";
try { const s = localStorage.getItem("tt_lang"); if (s === "ar" || s === "en") lang = s; } catch(e){}

function renderLinks(){
  const other = lang === "ar" ? "en" : "ar";
  const flip = lang === "ar" ? "scaleX(-1)" : "none";
  document.getElementById("links").innerHTML = LINKS.map(l => `
    <a class="link ${l.primary ? "primary" : ""}" href="${l.href}" target="_blank" rel="noopener">
      <span class="ico">${I[l.icon]}</span>
      <span class="t">${l[lang]}<small dir="${other==='ar'?'rtl':'ltr'}">${l[other]}</small></span>
      ${arrow.replace('<svg class="arrow"', `<svg class="arrow" style="transform:${flip}"`)}
    </a>`).join("");
}

let STATUS = { mode:"auto", reason_ar:"", reason_en:"" }; // يتحدّث من /api/status

function renderHours(){
  const t = TEXT[lang];
  const h = +new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"numeric",hour12:false}).format(new Date()) % 24;
  let open = h >= OPEN_H && h < CLOSE_H;
  if (STATUS.mode === "open") open = true;
  if (STATUS.mode === "closed") open = false;
  const box = document.getElementById("state");
  box.classList.toggle("is-open", open);
  box.classList.toggle("is-closed", !open);
  document.getElementById("hstate").textContent = open ? t.open : (STATUS.mode === "closed" ? t.tempClosed : t.closed);
  document.getElementById("htime").textContent = t.time;

  const reason = lang === "ar" ? (STATUS.reason_ar || STATUS.reason_en) : (STATUS.reason_en || STATUS.reason_ar);
  const n = document.getElementById("notice");
  document.getElementById("reason").textContent = reason || "";
  n.classList.toggle("show", STATUS.mode === "closed" && !!reason);
}

async function loadStatus(){
  try{
    const r = await fetch("/api/status", { cache:"no-store" });
    if(!r.ok) return;
    const s = await r.json();
    if (s && ["auto","open","closed"].includes(s.mode)) { STATUS = s; renderHours(); }
  }catch(e){}
}

function applyLang(){
  const t = TEXT[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = t.title;
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = t[el.dataset.i]);
  document.getElementById("langtxt").textContent = t.btn;
  renderLinks(); renderHours();
}

document.getElementById("lang").addEventListener("click", () => {
  lang = lang === "ar" ? "en" : "ar";
  try { localStorage.setItem("tt_lang", lang); } catch(e){}
  applyLang();
});

document.getElementById("social").innerHTML = SOCIAL.map(s =>
  `<a href="${s.href}" target="_blank" rel="noopener" aria-label="${s.name}">${I[s.icon]}</a>`).join("");
document.getElementById("y").textContent = new Date().getFullYear();

applyLang();
loadStatus();
setInterval(renderHours, 60000);
setInterval(loadStatus, 60000);

/* عدّاد الزيارات: يزيد مرة وحدة لكل جلسة، وإذا فشل الاتصال يظهر — */
(async function(){
  let seen = false;
  try { seen = !!sessionStorage.getItem("tt_seen"); } catch(e){}
  try{
    const r = await fetch(`${COUNTER}/${seen ? "get" : "hit"}/${COUNTER_KEY}`);
    if(!r.ok) throw 0;
    const d = await r.json();
    const n = d.count ?? d.value;
    if(typeof n !== "number") throw 0;
    document.getElementById("vc").textContent = n.toLocaleString("en");
        try { sessionStorage.setItem("tt_seen","1"); } catch(e){}
  }catch(e){}
})();
</script>
</body>
</html>
